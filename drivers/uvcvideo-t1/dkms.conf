PACKAGE_NAME="uvcvideo-t1"
PACKAGE_VERSION="0.1"
# this kernel's own drivers/media/usb/uvc + patches/ into build/ (prepare.sh);
# if that or the build fails, nothing is installed and the stock uvcvideo stays
PRE_BUILD="prepare.sh ${kernelver}"
MAKE[0]="make KDIR=${kernel_source_dir}"
BUILT_MODULE_NAME[0]="uvcvideo"
BUILT_MODULE_LOCATION[0]="build/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
