# MacBookPro13,2: the internal speakers only through "MacBook Speakers", the
# filter-chain with the crossover, EQ and the speaker guard (thermal model and
# limiter). The raw 4-channel speaker node is hidden from all clients, so
# nothing can play to the amps past the protection. If the graph file is
# missing or broken the speakers stay silent rather than unprotected.
# The graph is generated by 'mbp-audio gen' (see audio/README.md).

wireplumber.profiles = {
  main = {
    node.software-dsp = required
  }
}

node.software-dsp.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.speakers" }
    ]
    actions = {
      create-filter = {
        filter-path = "/var/lib/mbp-audio/speakers.conf"
        hide-parent = true
      }
    }
  }
]

# The raw node is "Audio/Sink/Internal", as WirePlumber does for the hardware
# side of split devices: pipewire-pulse (pactl, KDE, browsers) lists only
# Audio/Sink, so it never shows up there, while the filter still links to it.
# (hide-parent alone was racy: pipewire-pulse kept seeing the node.) It is
# also never picked as the default sink.
# Its own (software) volume stays at 1.0, locked: the only volume control is
# the one of "MacBook Speakers", at the input of the graph, before the
# protection. Without the lock WirePlumber gave the new route its default
# 0.4^3 = 0.064 (-23.9 dB), applied after the graph, where neither the null
# sink tests nor the thermal model see it; a volume above 1.0 there would
# drive the amps past the limiter.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.speakers" }
    ]
    actions = {
      update-props = {
        media.class = "Audio/Sink/Internal"
        priority.session = 100
        channelmix.lock-volumes = true
        channelmix.max-volume = 1.0
      }
    }
  }
]
