# MacBookPro13,2: use the profile set that opens the speakers as four
# channels (one per amp) and the headphones as stereo; see mbp13-2.conf.
# Matched on device.name only: the alsa.* properties are not there yet when
# the rule is applied (matches on alsa.components/alsa.mixer_name failed).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "mbp13-2.conf"
      }
    }
  }
]
