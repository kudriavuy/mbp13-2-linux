# ALSA card profile path: the four internal speakers of the MacBookPro13,2
# (see profile-sets/mbp13-2.conf). No mixer elements on purpose: the amps run
# at the fixed level the driver sets, the level comes from the speaker filter.
# Unavailable while headphones are plugged, so WirePlumber switches to the
# headphones profile then.

[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

[Jack Headphone]
state.plugged = no
state.unplugged = unknown
