# ALSA card profile set for the MacBookPro13,2 (CS8409 + 4x SSM3515 + CS42L83).
# Installed to /usr/share/alsa-card-profile/mixer/profile-sets/ and chosen by
# /etc/wireplumber/wireplumber.conf.d/90-mbp13-2-acp.conf.
#
# Speakers and headphones share PCM device 0. The default profile set opens
# it as stereo, and the driver then copies left/right to all four speaker
# amps: tweeters get the bass, no crossover is possible. Here they are two
# mappings, so two profiles:
#
#   speakers    4 channels on hw:0, one per amp, no ALSA volume (the
#               "MacBook Speakers" filter sets the level and protects the
#               speakers; WirePlumber hides this raw node). Not available
#               while headphones are plugged.
#   headphones  stereo on front:0 as before (softvol "PCM" volume); only
#               available while headphones are plugged.
#
# WirePlumber picks the available profile, so plugging and unplugging the
# headphones switches between the two. Microphone and HDMI mappings are the
# ones of default.conf, unchanged.

[General]
auto-profiles = yes

[Mapping speakers]
description = Speakers
device-strings = hw:%f
channel-map = front-left,front-right,rear-left,rear-right
paths-output = mbp13-2-speakers
priority = 15
direction = output

[Mapping headphones]
description = Headphones
device-strings = front:%f
channel-map = left,right
paths-output = analog-output-headphones
priority = 16
direction = output

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-input = analog-input-front-mic analog-input-rear-mic analog-input-internal-mic analog-input-dock-mic analog-input analog-input-mic analog-input-linein analog-input-aux analog-input-video analog-input-tvtuner analog-input-fm analog-input-mic-line analog-input-headphone-mic analog-input-headset-mic
priority = 15
direction = input

[Mapping hdmi-stereo]
description = Digital Stereo (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = left,right
priority = 9
direction = output

[Mapping hdmi-surround]
description = Digital Surround 5.1 (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
priority = 8
direction = output

[Mapping hdmi-surround71]
description = Digital Surround 7.1 (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe,side-left,side-right
priority = 8
direction = output

[Mapping hdmi-stereo-extra1]
description = Digital Stereo (HDMI 2)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = left,right
priority = 7
direction = output

[Mapping hdmi-surround-extra1]
description = Digital Surround 5.1 (HDMI 2)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
priority = 6
direction = output

[Mapping hdmi-surround71-extra1]
description = Digital Surround 7.1 (HDMI 2)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe,side-left,side-right
priority = 6
direction = output

[Mapping hdmi-stereo-extra2]
description = Digital Stereo (HDMI 3)
device-strings = hdmi:%f,2
paths-output = hdmi-output-2
channel-map = left,right
priority = 7
direction = output

[Mapping hdmi-surround-extra2]
description = Digital Surround 5.1 (HDMI 3)
device-strings = hdmi:%f,2
paths-output = hdmi-output-2
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
priority = 6
direction = output

[Mapping hdmi-surround71-extra2]
description = Digital Surround 7.1 (HDMI 3)
device-strings = hdmi:%f,2
paths-output = hdmi-output-2
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe,side-left,side-right
priority = 6
direction = output
