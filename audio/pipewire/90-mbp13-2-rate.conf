# MacBookPro13,2: the speaker amps run at 44.1 kHz only. With the stock
# allowed rates ([ 48000 ]) the graph, and with it the speaker guard, ran at
# 48 kHz and PipeWire resampled after the guard: +1.4 dB of inter-sample
# peaks over the -3 dBFS limiter on pink noise. Allowing 44.1 kHz lets the
# speakers drive the graph at their own rate, so nothing comes after the
# limiter (48 kHz sources are resampled before the graph). Other devices
# still get 48 kHz when they ask for it.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 ]
}
