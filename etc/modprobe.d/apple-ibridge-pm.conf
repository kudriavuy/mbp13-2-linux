# T1 (iBridge): tell it the host goes to sleep (ACPI ASOC.SOCW(0)), as macOS
# does, besides the SOCW(1) after every wake that apple-ibridge-pm always
# sends. 2026-10-18: after macOS had run, the T1 woke the Mac through the EC
# about 3 s into every sleep (an ACPI power-button event, the lid read as
# open; deep and s2idle alike, every OS wake source off) unless it got
# SOCW(0); with it a deep sleep held (196 s, woken by the lid). On
# 2026-10-15 (T1 freshly restored) SOCW(0) had woken the Mac at once
# instead: if sleeps end immediately again, set this to 0 and compare.
options apple_ibridge_pm suspend_notify=1
