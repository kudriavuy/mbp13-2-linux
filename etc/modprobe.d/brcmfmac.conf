# BCM43602: disable firmware supplicant (FWSUP, bit 13) and SAE (bit 19),
# workaround for the wpa_supplicant 2.11 regression on Broadcom FullMAC.
# roamoff=1: the 7.35 firmware roams between access points of one network on its own and then
# fails the 4-way handshake (iwd "fw-roaming" -> disconnected); let iwd roam.
options brcmfmac feature_disable=0x82000 roamoff=1
