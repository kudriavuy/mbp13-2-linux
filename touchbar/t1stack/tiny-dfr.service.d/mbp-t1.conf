# Stage 7: tiny-dfr in T1 configuration 2. A panic ends the process (patch
# 0003), 3 failures in 60 s hand the bar to mbp-t1-fallback.
[Unit]
PartOf=mbp-t1-cfg2.target
# Conflicts= (in mbp-t1-fallback) alone starts us while the fallback still
# holds the DRM master (EBUSY): any ordering makes the stop come first
After=mbp-t1-fallback.service
# every restart counts as a start: 2 allowed in 60 s, so the 3rd failure
# (whose restart would be the 3rd start) hands over to the fallback
StartLimitIntervalSec=60
StartLimitBurst=2
OnFailure=mbp-t1-fallback.service

[Service]
Environment=TINY_DFR_EXIT_ON_PANIC=1
Restart=on-failure
RestartSec=1
# restarts without passing through 'failed': OnFailure= only once the limit is hit
RestartMode=direct
